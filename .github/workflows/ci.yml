name: CI

on:
  push:
    branches: [main, nx-migration]
  pull_request:
    branches: [main, nx-migration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, test, build
        run: pnpm exec nx run-many -t lint type-check test build --parallel=2

      - name: E2E (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm exec nx run-many -t e2e --parallel=1

      - name: Deploy (main only, after green)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm exec nx affected -t deploy --parallel=1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
